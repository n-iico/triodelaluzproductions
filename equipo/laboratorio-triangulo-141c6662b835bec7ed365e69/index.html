<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>Acceso privado · Trío de la Luz Producciones</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #0b0e12;
      --stone: #1b212b;
      --white: #f4efe6;
      --muted: #9aa3af;
      --amber: #d8a657;
      --red: #d1503f;
      --blue: #4a7fb5;
      --green: #3f9b6e;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 50% 35%, rgba(74,127,181,.12), transparent 34rem),
        var(--night);
      color: var(--white);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(34rem, 100%); text-align: center; }
    .mark {
      position: relative;
      width: 5rem;
      height: 5rem;
      margin: 0 auto 2rem;
      animation: breathe 2.4s ease-in-out infinite;
    }
    .mark span {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      box-shadow: 0 0 1.4rem currentColor;
    }
    .mark span:nth-child(1) { color: var(--red); transform: translate(-2.1rem, -.5rem); }
    .mark span:nth-child(2) { color: var(--blue); transform: translate(1.1rem, -.5rem); }
    .mark span:nth-child(3) { color: var(--green); transform: translate(-.5rem, 1.25rem); }
    .mark::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: .72rem;
      height: .72rem;
      border-radius: 50%;
      background: var(--white);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 1.8rem rgba(244,239,230,.85);
    }
    h1 {
      margin: 0 0 .8rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3.25rem);
      font-weight: 400;
    }
    p { margin: 0 auto; color: var(--muted); line-height: 1.7; }
    .eyebrow {
      margin-bottom: 1.1rem;
      color: var(--amber);
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    form {
      display: grid;
      gap: .8rem;
      width: min(25rem, 100%);
      margin: 1.8rem auto 0;
      text-align: left;
    }
    label {
      color: var(--white);
      font-size: .82rem;
      font-weight: 650;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    input,
    button {
      width: 100%;
      min-height: 3.2rem;
      border-radius: .45rem;
      font: inherit;
    }
    input {
      border: 1px solid rgba(244,239,230,.22);
      padding: .75rem 1rem;
      background: rgba(27,33,43,.78);
      color: var(--white);
      outline: none;
    }
    input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(216,166,87,.16);
    }
    button {
      border: 1px solid var(--amber);
      padding: .75rem 1rem;
      background: var(--amber);
      color: var(--night);
      cursor: pointer;
      font-weight: 750;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { cursor: wait; opacity: .68; }
    #status { min-height: 1.7rem; margin-top: 1rem; }
    #detail { margin-top: .5rem; font-size: .86rem; }
    html.error .mark { animation: none; opacity: .55; }
    @keyframes breathe { 50% { transform: scale(1.06); filter: brightness(1.16); } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="eyebrow">Trío de la Luz Producciones</p>
    <h1>Acceso al laboratorio</h1>
    <p>Ingresa la clave compartida por el equipo.</p>
    <form id="gate">
      <label for="password">Clave de acceso</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">Entrar</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="detail">El contenido se descifra únicamente en este dispositivo.</p>
    <noscript>Necesitas activar JavaScript para abrir este contenido.</noscript>
  </main>
  <script>
    (() => {
      const form = document.getElementById("gate");
      const passwordField = document.getElementById("password");
      const submitButton = document.getElementById("submit");
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");

      if (location.hash) {
        history.replaceState(null, "", location.pathname + location.search);
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const password = passwordField.value;
        if (!password) return;

        document.documentElement.classList.remove("error");
        submitButton.disabled = true;
        submitButton.textContent = "Verificando…";
        status.textContent = "Comprobando la clave…";

        try {
          const response = await fetch("contenido.tlab", { cache: "no-store" });
          if (!response.ok) throw new Error("unavailable");

          const payload = new Uint8Array(await response.arrayBuffer());
          const magic = new TextDecoder().decode(payload.subarray(0, 4));
          if (magic !== "TDL2" || payload.length < 53) throw new Error("invalid-content");

          const iterations = new DataView(payload.buffer, payload.byteOffset, payload.byteLength).getUint32(4, false);
          if (iterations < 100000 || iterations > 2000000) throw new Error("invalid-content");

          const salt = payload.subarray(8, 24);
          const iv = payload.subarray(24, 36);
          const encryptedContent = payload.subarray(36);
          const keyMaterial = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
          );
          const key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
          const plaintext = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv, tagLength: 128 },
            key,
            encryptedContent
          );

          const html = new TextDecoder().decode(plaintext);
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          document.documentElement.classList.add("error");
          status.textContent = "La clave no es correcta o el contenido no está disponible.";
          detail.textContent = "Revisa la clave e inténtalo nuevamente.";
          passwordField.value = "";
          passwordField.focus();
          submitButton.disabled = false;
          submitButton.textContent = "Entrar";
        }
      });
    })();
  </script>
</body>
</html>
